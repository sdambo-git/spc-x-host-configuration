# 
# MachineConfig: disable PCIe ACS on the GPUDirect-RDMA data path on the worker
# (GPU) nodes, at every boot.
#
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 99-worker-disable-pcie-acs
spec:
  config:
    ignition:
      version: 3.5.0
    storage:
      files:
        - path: /usr/local/bin/disable-acs.sh
          mode: 0755
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: disable-acs.service
          enabled: true
          contents: |
            [Unit]
            Description=Disable PCIe ACS on NVIDIA GPU / NIC P2P paths (GPUDirect RDMA)
            Documentation=man:setpci(8)
            # ACS lives in extended PCI config space; devices must be enumerated first.
            After=systemd-udev-settle.service
            Wants=systemd-udev-settle.service
            # Registers persist until reboot / FLR, so run once per boot, before
            # the container runtime so pods never see the stock (ACS-on) state.
            Before=crio.service kubelet.service
            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/local/bin/disable-acs.sh
            [Install]
            WantedBy=multi-user.target
